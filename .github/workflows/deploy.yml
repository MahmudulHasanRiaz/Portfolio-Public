name: Deploy to Cloudflare

# Manual deploy button for the public site.
# Click: repo -> Actions -> "Deploy to Cloudflare" -> Run workflow.
# It only TRIGGERS the Cloudflare deploy hook (builds the latest main
# commit). It never runs on push - pushes must never deploy by themselves.
# The hook URL lives in the repository secret CLOUDFLARE_DEPLOY_HOOK_URL
# (repo -> Settings -> Secrets and variables -> Actions). Copy the URL from
# Cloudflare dashboard -> portfolio-public -> Settings -> Deploy Hooks
# ("manual-deploy" row -> copy button).

on:
    workflow_dispatch:
    inputs:
      reason:
        description: "Deploy reason (optional)"
        required: false
        default: "Manual deploy"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare deploy hook
        env:
          HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL secret is not set."
            echo "Add it in repo Settings -> Secrets and variables -> Actions."
            echo "Value = the deploy hook URL from the Cloudflare dashboard"
            echo "(portfolio-public -> Settings -> Deploy Hooks -> manual-deploy)."
            exit 1
          fi
          echo "Triggering Cloudflare deploy hook..."
          curl -sS -X POST "$HOOK_URL"
          echo ""
          echo "Deploy triggered. Watch it in Cloudflare -> portfolio-public -> Deployments."
